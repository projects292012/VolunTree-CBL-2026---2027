<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/x-icon" href="logo.png">
	<title>Task Page</title>
	<link rel="stylesheet" type="text/css" href="task.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet">
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
 
      emailjs.init({ publicKey: "Yyvz348QOGcUWby_s" });
    })();
  </script>
</script>
</head>
<body>
	<a href="voluntree.html"><i class="fa-solid fa-3xl fa-house"></i></a>
	<h1 class="font_rubik" id="name_task">NAME OF ACTIVITY</h1>
	<div id="task_div">
		<div class="input_div">
		<label>Location</label>
		<select id="location">
			<option value="" selected disabled>Select Location</option>
			<option>Location A</option>
			<option>Location B</option>
			<option>Location C</option>
		</select>
		</div>	
		<div class="input_div">
			<label>Date</label>
			<input type="date" id="date">
		</div>
		<div class="input_div">
		<label>Time</label>
		<select id="time">
			<option value="" selected disabled>Select Time</option>
			<option>4:30 pm</option>
			<option>2:00 pm</option>
			<option>6:30 pm</option>
		</select>
		</div>	
		<button id="register_btn">Register For Activity</button>
	</div>
	<div id="result_div">
		<h3>Please Check Your Email For Information</h3>
		<button id="ok_btn">OK</button>
	</div>
	<script src="task.js"></script>
</body>
</html>
